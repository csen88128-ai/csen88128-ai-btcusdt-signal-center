name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -q -e '.[dev]'
      - name: Ruff
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff-report.txt
      - name: Upload Ruff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.txt
      - name: Pytest
        run: pytest
